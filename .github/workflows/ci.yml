name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar las lecciones
        run: node scripts/validar.js
      - name: Comprobar sintaxis de los módulos web
        run: |
          for f in assets/web/assets/engine.js assets/web/assets/tools.js assets/web/assets/gitsim.js assets/web/assets/glosario.js assets/web/assets/catalog.js; do
            node --check "$f"
          done
