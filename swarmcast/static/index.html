<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SwarmCast</title>
<style>
body{font-family:system-ui,sans-serif;max-width:960px;margin:0 auto;padding:16px;background:#0f172a;color:#e2e8f0}
textarea,input,button{font:inherit;padding:8px;border-radius:6px;border:1px solid #334155;background:#1e293b;color:inherit;width:100%;box-sizing:border-box}
button{background:#0ea5e9;border:0;cursor:pointer;font-weight:600;margin-top:8px}
.row{display:flex;gap:8px}.card{background:#1e293b;border-radius:8px;padding:12px;margin:12px 0}
canvas{width:100%;height:220px;background:#0b1220;border-radius:6px}
.post{border-bottom:1px solid #334155;padding:6px 0;font-size:14px}.muted{color:#94a3b8}
pre{white-space:pre-wrap}
</style></head><body>
<h1>🐟 SwarmCast</h1><p class="muted">Sube un material semilla, formula una pregunta y simula un mundo digital de agentes para predecir la opinión.</p>
<div class="card">
<textarea id="seed" rows="6" placeholder="Material semilla (noticia, informe, texto)…">El Gobierno de Chile anunció una reforma de pensiones. Los sindicatos expresaron rechazo, mientras que analistas de Banco Central ven una oportunidad de crecimiento. Periodistas de La Tercera destacan el riesgo de protestas.</textarea>
<input id="q" value="¿La reforma de pensiones tendrá apoyo público?" style="margin-top:8px">
<div class="row"><input id="n" type="number" value="60" title="agentes"><input id="r" type="number" value="20" title="rondas"></div>
<input id="ev" placeholder='Evento opcional: ronda:desplazamiento:texto  ej. 10:-0.4:Escándalo de corrupción' style="margin-top:8px">
<button id="go">Simular</button></div>
<div id="out" hidden>
<div class="card"><b id="prob"></b><canvas id="cv" width="900" height="220"></canvas></div>
<div class="card"><h3>Informe</h3><pre id="rep" class="muted">Simulando…</pre></div>
<div class="card"><h3>Habla con un agente</h3><div class="row"><select id="ag"></select><input id="msg" value="¿Qué opinas y por qué?"><button id="send" style="width:120px;margin:0">Enviar</button></div><p id="reply"></p></div>
<div class="card"><h3>Muro simulado</h3><div id="feed"></div></div></div>
<script>
const $=id=>document.getElementById(id);let sid,timer;
$('go').onclick=async()=>{
 const body={seed:$('seed').value,question:$('q').value,agents:+$('n').value,rounds:+$('r').value};
 if($('ev').value){const [r,s,...t]=$('ev').value.split(':');body.events={[r]:{shift:+s,text:t.join(':')}}}
 const res=await fetch('/api/sim',{method:'POST',body:JSON.stringify(body)});sid=(await res.json()).id;
 $('out').hidden=false;$('rep').textContent='Simulando…';clearInterval(timer);timer=setInterval(poll,700);poll()};
async function poll(){
 const d=await (await fetch('/api/sim/'+sid)).json();
 $('prob').textContent=`Probabilidad a favor: ${d.probability_favor}% (${d.verdict}) — ronda ${d.final.round}`;
 draw(d.metrics);
 $('feed').innerHTML=d.posts.slice(-25).reverse().map(p=>`<div class="post"><b>${p.author}</b> <span class="muted">${p.role} · r${p.round}</span><br>${p.text}</div>`).join('');
 if(!$('ag').options.length)$('ag').innerHTML=d.agents.map(a=>`<option value="${a.id}">${a.name} (${a.role})</option>`).join('');
 if(d.status==='done'){clearInterval(timer);$('rep').textContent=d.report}}
function draw(m){const c=$('cv'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);
 const pts=(k,col,f)=>{x.strokeStyle=col;x.beginPath();m.forEach((p,i)=>{const X=i/(Math.max(m.length-1,1))*c.width,Y=c.height/2-f(p)*c.height/2*.9;i?x.lineTo(X,Y):x.moveTo(X,Y)});x.stroke()};
 x.strokeStyle='#334155';x.beginPath();x.moveTo(0,c.height/2);x.lineTo(c.width,c.height/2);x.stroke();
 pts('mean','#0ea5e9',p=>p.mean);pts('pol','#f59e0b',p=>p.polarization)}
$('send').onclick=async()=>{const r=await fetch('/api/chat/'+sid,{method:'POST',body:JSON.stringify({agent:+$('ag').value,message:$('msg').value})});$('reply').textContent=(await r.json()).reply}
</script></body></html>
