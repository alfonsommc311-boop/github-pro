name: github_pro
description: "GitHub PRO: aprende Git y GitHub de cero a experto: repositorios, ramas, pull requests, Actions, Pages, seguridad y el flujo con Claude Code. Terminal Git simulada. Funciona sin internet."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_inappwebview: ^6.1.5
  flutter_tts: ^4.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_native_splash:
  color: "#1e2a5e"
  image: assets/icon/foreground.png
  android: true
  ios: false
  fullscreen: true
  android_12:
    color: "#1e2a5e"
    image: assets/icon/foreground.png

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1e2a5e"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/web/
    - assets/web/assets/
    - assets/web/assets/img/
    - assets/web/lessons/
    - assets/web/icons/
